<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

</head>
<body>
    <div class="container">

        <div class="newbook-sidebar">
            <form action="index.html" id="newbook-form">
                <div class="form-row">
                    <label for="title">Title:</label>
                    <input type="text" id="title" name="title" required>
                </div>

                <div class="form-row">
                    <label for="author">Author:</label>
                    <input type="text" id="author" name="author" required>
                </div>

                <div class="form-row">
                    <label for="pages">Pages:</label>
                    <input type="number" id="pages" name="pages" min="0" step="10" required>
                </div>

                <div class="form-row">
                    <label for="isread">Isread:</label>
                    <input type="checkbox" id="isread" name="isread">
                </div>

                <button type="submit" form="newbook-form" class="newbook-btn">submit</button>
            </form>
        </div>

        <div class="books-container">
            
        </div>
    </div>
</body>
</html>
